<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="style.css"
      type="text/css"
      media="screen"
      charset="utf-8"
    />
  </head>
  <body>
    <header class="matrix">
      <img
        class="matrix__image"
        alt="Eisenhower matrix"
        src="./eisenhower-matrix.jpg"
      /><a
        class="matrix__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </header>
    <main class="todo-app">
      <div class="todo-app__add-section">
        <label class="todo-app__section-title" for="new-task">Add Item</label>
        <div class="todo-app__add-row">
          <input id="new-task" class="todo-app__input" type="text" />
          <button class="todo-app__button todo-app__button--add" type="button">
            Add
          </button>
        </div>
      </div>
      <h2 class="todo-app__heading">Todo</h2>
      <ul class="todo-app__list" id="incomplete-tasks">
        <li class="todo-app__item">
          <input
            class="todo-app__checkbox"
            type="checkbox"
            aria-label="Mark task completed"
          />
          <label class="todo-app__task-label">Pay Bills</label>
          <input
            class="todo-app__edit-input"
            type="text"
            aria-label="Edit task"
          />
          <button class="todo-app__button todo-app__button--edit" type="button">
            Edit
          </button>
          <button
            class="todo-app__button todo-app__button--delete"
            type="button"
            aria-label="Delete task"
          >
            <img src="./remove.svg" alt="" />
          </button>
        </li>
        <li class="todo-app__item todo-app__item--editing">
          <input
            class="todo-app__checkbox"
            type="checkbox"
            aria-label="Mark task completed"
          />
          <label class="todo-app__task-label">Go Shopping</label>
          <input
            class="todo-app__edit-input"
            type="text"
            value="Go Shopping"
            aria-label="Edit task"
          />
          <button class="todo-app__button todo-app__button--edit" type="button">
            Save
          </button>
          <button
            class="todo-app__button todo-app__button--delete"
            type="button"
            aria-label="Delete task"
          >
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
      <h2 class="todo-app__heading">Completed</h2>
      <ul class="todo-app__list todo-app__list--completed" id="completed-tasks">
        <li class="todo-app__item">
          <input
            class="todo-app__checkbox"
            type="checkbox"
            aria-label="Mark task completed"
            checked
          />
          <label class="todo-app__task-label">See the Doctor</label>
          <input
            class="todo-app__edit-input"
            type="text"
            aria-label="Edit task"
          />
          <button class="todo-app__button todo-app__button--edit" type="button">
            Edit
          </button>
          <button
            class="todo-app__button todo-app__button--delete"
            type="button"
            aria-label="Delete task"
          >
            <img src="./remove.svg" alt="" />
          </button>
        </li>
      </ul>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
